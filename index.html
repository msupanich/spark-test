<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantasy Star - Sega Master System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: monospace; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        h1 { margin-bottom: 20px; color: #4a90e2; text-transform: uppercase; letter-spacing: 2px; }
        #game { position: relative; border: 4px solid #4a90e2; border-radius: 8px; }
        #game canvas { display: block; background: #000; image-rendering: pixelated; }
        .controls { margin-top: 20px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        button { padding: 10px 20px; font-size: 14px; font-weight: bold; background: #4a90e2; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #3a7bc8; }
        button:disabled { background: #555; cursor: not-allowed; }
        .status { margin-top: 15px; color: #666; font-size: 14px; }
        .info-box { margin-top: 20px; padding: 15px; background: #222; border-radius: 8px; max-width: 600px; }
        .info-box h3 { color: #4a90e2; margin-bottom: 10px; }
        .info-box p { margin-bottom: 10px; line-height: 1.5; }
        .keyboard { margin-top: 20px; padding: 20px; background: #222; border-radius: 8px; }
        .keyboard h3 { color: #4a90e2; margin-bottom: 15px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .key { padding: 4px 8px; background: #444; border-radius: 4px; font-size: 12px; }
        .file-upload { margin-top: 20px; padding: 20px; background: #222; border-radius: 8px; text-align: center; }
        .file-upload input[type="file"] { margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Phantasy Star - Sega Master System</h1>
    <div class="info-box">
        <h3>About</h3>
        <p>This web emulator runs Sega Master System games with full CPU emulation.</p>
        <p><strong>Phantasy Star</strong> ROM is included in this repo.</p>
    </div>
    <div class="file-upload">
        <label for="romInput">Select ROM file:</label>
        <input type="file" id="romInput" accept=".sms,.gen,.bin">
    </div>
    <div id="game">
        <canvas id="canvas" width="256" height="240"></canvas>
        <div id="loading" style="position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;justify-content:center;align-items:center;color:#4a90e2;z-index:10;">
            Loading...
        </div>
    </div>
    <div class="controls">
        <button id="resetBtn" disabled>Reset</button>
        <button id="saveBtn" disabled>Save State</button>
        <button id="loadBtn" disabled>Load State</button>
    </div>
    <div class="keyboard">
        <h3>Controls</h3>
        <div class="row"><span>Arrow Keys / WASD:</span> <span class="key">Move</span></div>
        <div class="row"><span>Space / Z:</span> <span class="key">Button 1</span></div>
        <div class="row"><span>X:</span> <span class="key">Button 2</span></div>
        <div class="row"><span>Enter:</span> <span class="key">Start</span></div>
        <div class="row"><span>R:</span> <span class="key">Reset</span></div>
    </div>
    <div class="status" id="status">Select a ROM file to begin</div>
    
    <!-- EmulatorJS CDN -->
    <script>
        // Configure EmulatorJS before loading loader.js
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_player = '#game';
        window.EJS_startOnLoaded = true;
        window.EJS_hideSettings = true;
        window.EJS_volume = 0.5;
        window.EJS_gameName = 'Phantasy Star';
        window.EJS_gameUrl = 'Phantasy Star (World).sms';
        
        window.EJS_ready = function() {
            console.log('EmulatorJS ready');
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status').textContent = 'Emulator ready! Select a ROM file or click Start to use Phantasy Star.';
            
            // Try to auto-load the ROM from CDN
            const romUrl = 'https://msupanich.github.io/spark-test/Phantasy%20Star%20%28World%29.sms';
            fetch(romUrl)
                .then(response => {
                    if (response.ok) return response.blob();
                    throw new Error('ROM not found');
                })
                .then(blob => {
                    window.EJS_emulator.downloadROM(blob, 'Phantasy Star (World).sms');
                    console.log('ROM auto-loaded from CDN');
                })
                .catch(err => {
                    console.log('ROM auto-load failed:', err);
                });
        };
        
        window.EJS_onGameStart = function() {
            document.getElementById('status').textContent = 'Game running!';
            document.getElementById('resetBtn').disabled = false;
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('loadBtn').disabled = false;
        };
        
        window.EJS_onExit = function() {
            document.getElementById('status').textContent = 'Game exited';
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('saveBtn').disabled = true;
            document.getElementById('loadBtn').disabled = true;
        };
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    
    <!-- Custom UI controls -->
    <script src="emulator.js"></script>
</body>
</html>
